name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: yes | sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Configure release signing
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > flutter_app/android/app/streamed-release.jks
          cat > flutter_app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=streamed-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-pub

      - name: Run widget tests
        run: flutter test --no-pub

      - name: Build signed release APK
        id: build
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="${{ inputs.version }}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          flutter build apk --release --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME" \
            --dart-define=TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID" \
            --dart-define=TRAKT_CLIENT_SECRET="$TRAKT_CLIENT_SECRET"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "streamed-$VERSION_NAME.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          TAG_NAME: ${{ steps.build.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            "flutter_app/streamed-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Streamed $VERSION_NAME" \
            --generate-notes

      - name: Publish update manifest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          TAG_NAME: ${{ steps.build.outputs.tag_name }}
        run: |
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/streamed-$VERSION_NAME.apk"
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "apkUrl": "%s"\n}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$APK_URL" > update.json
          gh release upload "$TAG_NAME" update.json --repo "$GITHUB_REPOSITORY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamed-release-apk
          path: flutter_app/streamed-*.apk
          if-no-files-found: error
